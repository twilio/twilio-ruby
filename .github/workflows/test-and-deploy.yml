name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
    pull_request:
      branches: [ main ]
    schedule:
      # Run automatically at 8AM PST Monday-Friday
      - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  lockfile-hygiene:
    name: Lockfile Hygiene
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: twilio/sdk-actions/gems-lockfile-hygiene@558bba0b6fe12195370f5269dfe53db5db3bb9a6 # v1

  test:
    name: Test
    needs: [ lockfile-hygiene ]
    runs-on: ubuntu-x64
    timeout-minutes: 20
    strategy:
      matrix:
        ruby: [ '3.0', '3.1', '3.2', '3.3', '3.4', 'jruby-9.4']
    steps:
      - name: Checkout twilio-ruby
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: ${{ matrix.ruby }}

      # Excludes incompatible versions of ruby
      - name: Set up linter
        run: bundle update rubocop
        if: ${{ matrix.ruby != '2.4' }}

      - run: bundle install --with development
      - run: bundle exec rake install

      - name: Run linter
        run: bundle exec rubocop -d --cache true --parallel
        if: ${{ matrix.ruby != '2.4'}}

      - name: Run Unit Tests
        run: make test

      - name: Run Cluster Test
        if: (!github.event.pull_request.head.repo.fork)
        env:
         TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
         TWILIO_API_KEY: ${{ secrets.TWILIO_CLUSTER_TEST_API_KEY}}
         TWILIO_API_SECRET: ${{ secrets.TWILIO_CLUSTER_TEST_API_KEY_SECRET }}
         TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
         TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
         TWILIO_ORGS_ACCOUNT_SID: ${{ secrets.TWILIO_ORGS_ACCOUNT_SID }}
         TWILIO_ORGS_CLIENT_SECRET: ${{ secrets.TWILIO_ORGS_CLIENT_SECRET }}
         TWILIO_ORGS_CLIENT_ID: ${{ secrets.TWILIO_ORGS_CLIENT_ID }}
         TWILIO_ORG_SID: ${{ secrets.TWILIO_ORG_SID }}
         TWILIO_USER_SID: ${{ secrets.TWILIO_USER_SID }}
         TWILIO_CLIENT_SECRET: ${{ secrets.TWILIO_CLIENT_SECRET }}
         TWILIO_CLIENT_ID: ${{ secrets.TWILIO_CLIENT_ID }}
         TWILIO_MESSAGE_SID: ${{ secrets.TWILIO_MESSAGE_SID }}
        run: make cluster-test

      - name: Fix code coverage paths
        if: ${{ (github.event_name == 'pull_request' || github.ref_type == 'branch') && matrix.ruby == '3.0' && !github.event.pull_request.head.repo.fork }}
        working-directory: ./coverage
        run: |
          sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace/@g' coverage.json


  deploy:
    name: deploy
    if: success() && github.ref_type == 'tag'
    runs-on: ubuntu-x64
    environment: production
    needs: [ test ]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout twilio-ruby
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e
        with:
          registry-path: virtual-gems-thirdparty
          ecosystem: ruby

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Get tagged version
        run: echo "GITHUB_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: sendgrid/dx-automator/actions/release@08b601b726671445abc798ed59881766ec8fefc6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Rubygems
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092