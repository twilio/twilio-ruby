name: Test Artifactory OIDC (Ruby)
on:
  workflow_dispatch:
  push:
    branches: [dv/test-artifactory-oidc]

jobs:
  test-oidc:
    runs-on: ubuntu-x64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      - uses: twilio/sdk-actions/artifactory-oidc@503c9ad52a5b8f4b461422c772f816e9e1d48c0f
        with:
          ecosystem: ruby
      - name: Verify Bundler mirror is configured
        run: |
          cat ~/.bundle/config
          grep -q "twilio.jfrog.io" ~/.bundle/config \
            && echo "OK — mirror points to Artifactory" \
            || { echo "FAIL — config file not set"; exit 1; }
      - name: Install Ruby and test bundle install
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y ruby bundler
          bundle install --verbose 2>&1 | head -80
          echo "bundle install succeeded"
